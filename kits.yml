# Catálogo de kits — dónde vive cada uno y en qué versión.
#
# Un kit es una capa que aporta una capacidad a un proyecto. El hub los resuelve
# por `id`: un proyecto dice «uso `orquestacion` 1.2» y el hub sabe de dónde
# sacarlo. Referenciarlos por ruta relativa —`../orquestador`— se rompe en cuanto
# cualquiera de los dos se mueve.
#
# Se instalan en `~/.local/share/hub/kits/<id>/<version>/`, con la versión EN LA
# RUTA: todas coexisten, como en `~/.m2/repository`. Así un proyecto puede
# quedarse en 1.2 mientras otro pasa a 2.0, sin migrarlos a la vez.
#
#   bash scripts/kit.sh listar
#   bash scripts/kit.sh instalar <id> [version]
#
# 🔴 Un tag publicado no se mueve. Si hay que corregir algo, se publica la
# siguiente versión. Si un tag se reescribiera, todo lo que midió deriva contra
# él pasaría a mentir sin avisar.
#
# Tus kits propios van en `~/.local/share/hub/kits.yml`, con el mismo formato:
# los dos archivos se fusionan por `id` y gana el tuyo. Así añades los tuyos sin
# tocar este repo.

kits:
  # La capa base la trae el gestor consigo: no se descarga de ningún sitio.
  - id: base
    nombre: Capa base
    version: "1.0"
    origen: interno
    descripcion: Identidad del proyecto y punteros a lo que ya tiene. Obligatoria.
    obligatorio: true

  # Publicar contenido visual en la web del hub (decisión 157). La skill y las
  # plantillas viven en el kit; el comando `hub lienzo` y los motores de dibujo,
  # en el hub. Es el kit que este mismo repo declara en `.claude/hub/kits.yml`.
  - id: lienzos
    nombre: Lienzos
    version: "0.2"
    origen: https://github.com/DaniGuerraNa/kit-lienzos.git
    descripcion: Publicar diagramas, decisiones, pasos y comparativas en la web del hub en vez de soltarlos como texto.

  # Que una sesión que trabaja sola pueda preguntarle a otra persona por
  # Telegram cuando el dueño no está, y seguir con la respuesta.
  - id: telegram
    nombre: Consulta por Telegram
    version: "0.2"
    origen: https://github.com/DaniGuerraNa/kit-telegram.git
    descripcion: Que una sesión pueda preguntarle a otra persona por Telegram cuando tú no estás, y seguir trabajando con la respuesta.

  # Kit de MÁQUINA: no toca proyectos, pone dos comandos en ~/.local/bin. Su
  # instalador lo enseña el hub y lo lanza la persona.
  - id: en-toolkit
    nombre: Inmersión en inglés
    version: "1.0"
    origen: https://github.com/DaniGuerraNa/en-toolkit.git
    descripcion: Mejorar tu inglés mientras programas. Guarda el vocabulario que buscas para repasarlo, y una sesión de Claude que te contesta en inglés y te corrige.

  # El método para trabajar de forma semiautónoma: roles, delegación y el
  # techo de consumo. La 2.1 es la primera limpia para el catálogo público.
  - id: orquestacion
    nombre: Orquestación
    version: "2.1"
    origen: https://github.com/DaniGuerraNa/kit-orquestacion.git
    descripcion: Trabajar de forma semiautónoma con Claude Code — método, roles, delegación y techo de consumo.
