# Lo abre /incidencia del hub con los campos ya rellenos por su `id`
# (C-0468). 🔴 Ni este archivo ni los `id` se renombran: un hub viejo sigue
# enlazando a ellos. Las etiquetas van aquí y no en la URL.
name: Un fallo
description: Algo del hub no hace lo que debería.
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por contarlo. **Lo que escribas aquí es público**: no pongas contraseñas, rutas de tus carpetas ni nombres de tus proyectos o de otras personas.

        Desde el hub (Ajustes → «Contar un fallo o una idea») este formulario llega relleno con la versión y lo justo del equipo.
  - type: textarea
    id: que_paso
    attributes:
      label: Qué pasó
      description: Qué hacías, qué esperabas que pasara y qué pasó. Si se repite, cómo provocarlo.
    validations:
      required: true
  - type: textarea
    id: equipo
    attributes:
      label: Datos del equipo
      description: >-
        Los pone el hub, sin rutas, usuario ni nombres. Si no vienes del hub, al menos su versión
        (en la carpeta del hub, `uv run python -m hub.version codigo`).
      render: text
    validations:
      required: false
