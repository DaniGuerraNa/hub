[project]
name = "puente-kvm"
version = "0.1.0"
description = "Puente entre Claude Code y un Mac remoto a través de un JetKVM"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiortc>=1.16,<1.17",
    "av>=19.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=1.2,<2",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.30",
    "websockets>=17.4",
]

[project.scripts]
puente-kvm = "puente_kvm.__main__:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
