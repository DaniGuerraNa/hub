[project]
name = "navegador-lab"
version = "0.1.0"
description = "Un navegador que maneja Claude, con un guardián que pausa lo que modifica"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
