[project]
name = "reuniones"
version = "0.1.0"
description = "Graba una reunión de otro monitor y la procesa en local: transcripción, resumen y tareas"
requires-python = ">=3.12"
dependencies = [
    "av>=17,<18",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.23.1.3",
    "pillow>=13.0.0",
    "pyannote-audio>=3.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
reuniones = "reuniones.procesar:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
