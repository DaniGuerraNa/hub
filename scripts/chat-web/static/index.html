<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encargos</title>
<style>
  :root { --fondo:#f6f4ef; --sup:#fff; --texto:#1f1b16; --tenue:#7d756b; --acento:#a34a1e; --sobre:#fff; --mio:#ffe9d6; --borde:#e6e0d6; --radio:14px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fondo); color:var(--texto); height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--sup); border-bottom:1px solid var(--borde); display:flex; align-items:center; justify-content:space-between; }
  header b { font-size:16px; }
  header button { border:0; background:none; color:var(--tenue); font:inherit; cursor:pointer; }
  main { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:10px 13px; border-radius:var(--radio); background:var(--sup); border:1px solid var(--borde); font-size:15px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word; }
  .msg.entra { align-self:flex-end; background:var(--mio); border-color:#f3d3b8; }
  .msg img { max-width:100%; border-radius:10px; display:block; }
  .msg audio { max-width:100%; }
  .pie { font-size:12px; color:var(--tenue); margin-top:4px; }
  .botones { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .botones button { border:1px solid var(--acento); background:var(--sup); color:var(--acento); padding:7px 12px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; }
  .escribiendo { align-self:flex-start; color:var(--tenue); font-size:13px; padding:4px 8px; }
  footer { padding:10px 12px; background:var(--sup); border-top:1px solid var(--borde); display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; border:1px solid var(--borde); border-radius:12px; padding:10px 12px; font:inherit; font-size:15px; max-height:120px; }
  footer button { border:0; border-radius:999px; padding:10px 14px; font:inherit; font-size:14px; cursor:pointer; background:var(--acento); color:var(--sobre); }
  footer button.sec { background:#eee8de; color:var(--texto); }
  footer button.grabando { background:#c62828; }
  #entrar { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  #entrar form { background:var(--sup); border:1px solid var(--borde); border-radius:16px; padding:24px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:10px; }
  #entrar input { padding:12px; border:1px solid var(--borde); border-radius:10px; font:inherit; font-size:16px; }
  #entrar button { padding:12px; border:0; border-radius:999px; background:var(--acento); color:var(--sobre); font:inherit; font-size:15px; cursor:pointer; }
  #entrar .error { color:#b3261e; font-size:14px; min-height:18px; }
  .oculto { display:none !important; }
  @media (min-width: 700px) { main { padding:18px 10%; } .msg { max-width:60%; } footer { padding:12px 10%; } }
</style>
</head>
<body>
<header>
  <b id="titulo">Encargos</b>
  <button id="salir" class="oculto">salir</button>
</header>

<section id="entrar">
  <form id="form-entrar">
    <div><b>Entra para hablar con el asistente</b></div>
    <input id="usuario" name="usuario" placeholder="usuario" autocomplete="username" autocapitalize="none" required>
    <input id="clave" name="clave" type="password" placeholder="contraseña" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button type="submit">Entrar</button>
  </form>
</section>

<main id="chat" class="oculto"></main>

<footer id="pie" class="oculto">
  <button id="grabar" class="sec" type="button" title="Grabar un audio">🎙️</button>
  <textarea id="texto" rows="1" placeholder="Escribe aquí…"></textarea>
  <button id="enviar" type="button">Enviar</button>
</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), ultimo = 0, sondeo = null, escribiendoEl = null;
  var grabadora = null, trozos = [];

  function muestra(entrando) {
    $('entrar').classList.toggle('oculto', !entrando);
    chat.classList.toggle('oculto', entrando);
    $('pie').classList.toggle('oculto', entrando);
    $('salir').classList.toggle('oculto', entrando);
  }

  function pinta(m) {
    var div = document.createElement('div');
    div.className = 'msg ' + m.direccion;
    div.dataset.id = m.id;
    if (m.tipo === 'foto') {
      var img = document.createElement('img');
      img.src = '/medios-hub/' + encodeURIComponent(m.medio);
      img.alt = m.texto || '';
      div.appendChild(img);
      if (m.texto) { var p = document.createElement('div'); p.className = 'pie'; p.textContent = m.texto; div.appendChild(p); }
    } else if (m.tipo === 'audio') {
      var au = document.createElement('audio');
      au.controls = true; au.src = '/medios/' + encodeURIComponent(m.medio);
      div.appendChild(au);
    } else {
      div.textContent = m.texto;
    }
    if (m.botones) {
      var lista;
      try { lista = JSON.parse(m.botones); } catch (e) { lista = []; }
      if (lista.length) {
        var caja = document.createElement('div'); caja.className = 'botones';
        lista.forEach(function (b) {
          var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = b[0];
          btn.addEventListener('click', function () { pulsa(m.id, b[1], caja); });
          caja.appendChild(btn);
        });
        div.appendChild(caja);
      }
    }
    chat.appendChild(div);
  }

  function abajo() { chat.scrollTop = chat.scrollHeight; }

  function pulsa(id, dato, caja) {
    var fd = new FormData(); fd.append('mensaje_id', id); fd.append('dato', dato);
    fetch('/api/botones', { method: 'POST', body: fd }).then(function (r) {
      if (r.ok) { caja.remove(); }
    });
  }

  function refresca() {
    fetch('/api/mensajes?desde=' + ultimo).then(function (r) {
      if (r.status === 401) { muestra(true); return null; }
      return r.json();
    }).then(function (d) {
      if (!d) return;
      var habia = ultimo;
      d.mensajes.forEach(function (m) { pinta(m); ultimo = Math.max(ultimo, m.id); });
      if (d.escribiendo && !escribiendoEl) {
        escribiendoEl = document.createElement('div'); escribiendoEl.className = 'escribiendo'; escribiendoEl.textContent = 'escribiendo…';
        chat.appendChild(escribiendoEl);
      } else if (!d.escribiendo && escribiendoEl) { escribiendoEl.remove(); escribiendoEl = null; }
      if (escribiendoEl) chat.appendChild(escribiendoEl);
      if (ultimo !== habia || d.escribiendo) abajo();
    }).catch(function () {});
  }

  function empieza(nombre) {
    $('titulo').textContent = nombre ? 'Hola, ' + nombre : 'Encargos';
    muestra(false);
    chat.innerHTML = ''; ultimo = 0;
    refresca();
    if (sondeo) clearInterval(sondeo);
    sondeo = setInterval(refresca, 2000);
  }

  $('form-entrar').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('error').textContent = '';
    var fd = new FormData(); fd.append('usuario', $('usuario').value.trim()); fd.append('clave', $('clave').value);
    fetch('/entrar', { method: 'POST', body: fd }).then(function (r) {
      if (!r.ok) { $('error').textContent = 'Usuario o contraseña incorrectos.'; return null; }
      return r.json();
    }).then(function (d) { if (d) empieza(d.nombre); });
  });

  $('salir').addEventListener('click', function () {
    fetch('/salir', { method: 'POST' }).then(function () { location.reload(); });
  });

  function manda() {
    var t = $('texto').value.trim();
    if (!t) return;
    var fd = new FormData(); fd.append('texto', t);
    $('texto').value = '';
    fetch('/api/mensajes', { method: 'POST', body: fd }).then(refresca);
  }
  $('enviar').addEventListener('click', manda);
  $('texto').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); manda(); }
  });

  $('grabar').addEventListener('click', function () {
    if (grabadora && grabadora.state === 'recording') { grabadora.stop(); return; }
    if (!navigator.mediaDevices) { alert('Este navegador no puede grabar audio.'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      trozos = [];
      grabadora = new MediaRecorder(stream);
      grabadora.ondataavailable = function (e) { if (e.data.size) trozos.push(e.data); };
      grabadora.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        $('grabar').classList.remove('grabando'); $('grabar').textContent = '🎙️';
        var blob = new Blob(trozos, { type: grabadora.mimeType || 'audio/webm' });
        var fd = new FormData(); fd.append('audio', blob, 'audio.webm');
        fetch('/api/mensajes', { method: 'POST', body: fd }).then(refresca);
      };
      grabadora.start();
      $('grabar').classList.add('grabando'); $('grabar').textContent = '■';
    }).catch(function () { alert('No se pudo usar el micrófono.'); });
  });

  fetch('/api/yo').then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d) empieza(d.nombre); else muestra(true); });
})();
</script>
</body>
</html>
